<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Redes Sociais | PsiFácil</title>

    <meta
        name="description"
        content="Encontre o PsiFácil nas redes sociais e acompanhe nossos conteúdos sobre saúde mental, comportamento e bem-estar."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#315650"
    >


    <!-- =====================================================
         URL CANÔNICA
    ====================================================== -->

    <link
        rel="canonical"
        href="https://psifacilblog.com.br/links"
    >


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="img/logo-psifacilRedes.svg"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/linksPSIFacil/linksRedes.css"
    >


    <!-- =====================================================
         LUCIDE
    ====================================================== -->

    <script
        src="https://unpkg.com/lucide@latest"
        defer
    ></script>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="/linksPSIFacil/linksRedes.js"
        defer
    ></script>

</head>


<body>


    <!-- =====================================================
         DECORAÇÃO DO FUNDO
    ====================================================== -->

    <div
        class="background-decoration background-decoration-one"
        aria-hidden="true"
    ></div>

    <div
        class="background-decoration background-decoration-two"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         PÁGINA
    ====================================================== -->

    <main class="links-page">


        <!-- =================================================
             PERFIL
        ================================================== -->

        <header class="profile">


            <!-- LOGO PRINCIPAL -->

            <div
                class="brand-icon"
                aria-hidden="true"
            >

                <div class="brand-icon-inner">

                    <i data-lucide="brain"></i>

                </div>

            </div>


            <!-- NOME -->

            <h1>
                PsiFácil
            </h1>


            <!-- USUÁRIO -->

            <p class="profile-user">
                @psifacil.oficial
            </p>


            <!-- DESCRIÇÃO -->

            <p class="profile-description">

                Conteúdos sobre saúde mental,
                comportamento e bem-estar.

                <span>
                    Acompanhe o PsiFácil nas redes sociais.
                </span>

            </p>


        </header>


        <!-- =================================================
             TÍTULO
        ================================================== -->

        <div class="links-heading">

            <span></span>

            <p>
                Onde nos encontrar
            </p>

            <span></span>

        </div>


        <!-- =================================================
             LINKS DAS REDES SOCIAIS
        ================================================== -->

        <section
            class="social-links"
            id="socialLinks"
            aria-label="Links oficiais do PsiFácil"
        >

            <!--
                Os cards são criados automaticamente
                pelo linksRedes.js
            -->

        </section>


        <!-- =================================================
             RODAPÉ
        ================================================== -->

        <footer class="links-footer">


            <div class="footer-brand">

                <img
                    src="/linksPSIFacil/img/logo-psifacilRedes.svg"
                    alt=""
                    class="footer-logo"
                >

                <strong>
                    PsiFácil
                </strong>

            </div>


            <p>
                Informação que acolhe.
                Conhecimento que aproxima.
            </p>


            <span class="footer-copy">

                ©
                <span id="anoAtual"></span>
                PsiFácil

            </span>


        </footer>


    </main>


</body>

</html>
