<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXHLZFTYTN"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());

    gtag("config", "G-QXHLZFTYTN");
  </script>


  <!-- CONFIGURAÇÕES -->
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >


  <!-- FAVICON -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="img/favicon.svg"
  >


  <!-- SEO -->
  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  >

  <title>Artigo | PsiFácil</title>

  <meta
    name="description"
    id="metaDescription"
    content="Leia este artigo no PsiFácil."
  >


  <!-- CANONICAL -->
  <link
    rel="canonical"
    id="canonicalUrl"
    href="https://psifacilblog.com.br/post.html"
  >


  <!-- OPEN GRAPH -->
  <meta
    property="og:type"
    content="article"
  >

  <meta
    property="og:title"
    id="ogTitle"
    content="Artigo | PsiFácil"
  >

  <meta
    property="og:description"
    id="ogDescription"
    content="Leia este artigo no PsiFácil."
  >

  <meta
    property="og:url"
    id="ogUrl"
    content="https://psifacilblog.com.br/post.html"
  >

  <meta
    property="og:site_name"
    content="PsiFácil"
  >

  <meta
    property="og:locale"
    content="pt_BR"
  >


  <!-- TWITTER / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Artigo | PsiFácil"
  >

  <meta
    name="twitter:description"
    content="Leia este artigo no PsiFácil."
  >


  <!-- STRUCTURED DATA -->
  <script
    type="application/ld+json"
    id="articleSchema"
  >
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "Artigo | PsiFácil",
    "description": "Leia este artigo no PsiFácil.",
    "url": "https://psifacilblog.com.br/post.html",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://psifacilblog.com.br/post.html"
    },
    "publisher": {
      "@type": "Organization",
      "name": "PsiFácil",
      "url": "https://psifacilblog.com.br/"
    }
  }
  </script>


  <!-- FONTES -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- CSS -->
  <link
    rel="stylesheet"
    href="css/post.css"
  >


  <!-- GOOGLE ADSENSE -->
  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8328619879268221"
    crossorigin="anonymous">
  </script>

</head>


<body>


  <!-- =====================================================
       PROGRESSO DA LEITURA
  ====================================================== -->

  <div
    class="reading-progress"
    aria-hidden="true"
  >

    <div
      class="reading-progress-bar"
      id="readingBar">
    </div>

  </div>


  <!-- =====================================================
       TOPO DA PÁGINA
  ====================================================== -->

  <header class="post-topbar">

    <div class="post-topbar-container">

      <a
        href="psifacil.html"
        class="post-brand"
        aria-label="Voltar para a página inicial do PsiFácil"
      >

        <img
          src="img/favicon.svg"
          alt=""
          class="post-brand-icon"
        >

        <span>
          PsiFácil
        </span>

      </a>


      <a
        href="psifacil.html"
        class="post-back-link"
      >

        <i data-lucide="arrow-left"></i>

        <span>
          Voltar ao início
        </span>

      </a>

    </div>

  </header>


  <!-- =====================================================
       PÁGINA
  ====================================================== -->

  <main class="post-page">


    <div class="post-layout">


      <!-- =================================================
           ARTIGO
      ================================================== -->

      <article
        class="post-detail"
        id="postDetalhe"
      >

        <div class="post-loading">

          <div class="post-loading-icon">

            <i data-lucide="book-open"></i>

          </div>

          <p>
            Carregando artigo...
          </p>

        </div>

      </article>


      <!-- =================================================
           SIDEBAR
      ================================================== -->

      <aside
        class="post-sidebar"
        aria-label="Opções do artigo"
      >


        <!-- ===============================================
             AÇÕES
        ================================================ -->

        <div class="post-actions">


          <!-- CURTIR -->

          <button
            id="btnCurtir"
            class="action-btn like-btn"
            type="button"
            aria-label="Curtir este artigo"
          >

            <span class="action-icon">

              <i data-lucide="heart"></i>

            </span>

            <span class="action-text">

              <span class="label">
                Curtir
              </span>

              <span
                id="totalCurtidas"
                class="count"
              >
                0
              </span>

            </span>

          </button>


          <!-- COMPARTILHAR -->

          <button
            id="btnCompartilhar"
            class="action-btn share-btn"
            type="button"
            aria-label="Compartilhar este artigo"
          >

            <span class="action-icon">

              <i data-lucide="share-2"></i>

            </span>

            <span class="action-text">

              <span class="label">
                Compartilhar
              </span>

              <span class="sub">
                Enviar
              </span>

            </span>

          </button>


          <!-- SALVAR -->

          <button
            id="btnSalvar"
            class="action-btn salvar-btn"
            type="button"
            aria-label="Salvar artigo para ler depois"
          >

            <span class="action-icon">

              <i data-lucide="bookmark"></i>

            </span>

            <span class="action-text">

              <span class="label">
                Salvar
              </span>

              <span class="sub">
                Ler depois
              </span>

            </span>

          </button>


          <!-- =============================================
               REDES SOCIAIS
          ============================================== -->

          <div class="social-box">

            <span class="social-title">
              Acompanhe o PsiFácil
            </span>

            <div class="social-icons">


              <!-- INSTAGRAM -->

              <a
                href="https://www.instagram.com/psifacil.oficial/"
                target="_blank"
                rel="noopener noreferrer"
                class="social-btn instagram"
                aria-label="PsiFácil no Instagram"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >

                  <path
                    d="M7.5 2C4.46 2 2 4.46 2 7.5v9C2 19.54 4.46 22 7.5 22h9c3.04 0 5.5-2.46 5.5-5.5v-9C22 4.46 19.54 2 16.5 2h-9zm0 2h9c1.93 0 3.5 1.57 3.5 3.5v9c0 1.93-1.57 3.5-3.5 3.5h-9C5.57 20 4 18.43 4 16.5v-9C4 5.57 5.57 4 7.5 4zm9.75 1a.75.75 0 100 1.5.75.75 0 000-1.5zM12 7a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6z"
                  />

                </svg>

              </a>


              <!-- YOUTUBE -->

              <a
                href="https://www.youtube.com/@PSIFACIL.OFICIAL"
                target="_blank"
                rel="noopener noreferrer"
                class="social-btn youtube"
                aria-label="PsiFácil no YouTube"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >

                  <path
                    d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.9-1.7-.9-2.1-1C17.5 2.6 12 2.6 12 2.6h0s-5.5 0-8.6.3c-.5.1-1.3.1-2.1 1C.7 4.6.5 6.2.5 6.2S.2 8 .2 9.8v1.4c0 1.8.3 3.6.3 3.6s.2 1.6.8 2.3c.8.9 1.9.9 2.4 1 1.7.2 7.3.3 7.3.3s5.5 0 8.6-.3c.5-.1 1.3-.1 2.1-1 .6-.7.8-2.3.8-2.3s.3-1.8.3-3.6V9.8c0-1.8-.3-3.6-.3-3.6zM9.8 14.7V7.8l6 3.5-6 3.4z"
                  />

                </svg>

              </a>


              <!-- TIKTOK -->

              <a
                href="#"
                class="social-btn tiktok"
                aria-label="PsiFácil no TikTok"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >

                  <path
                    d="M12.5 2h2.3c.2 1.6 1.1 3 2.7 3.7v2.4c-1.2 0-2.4-.4-3.4-1.1v6.1c0 3.1-2.5 5.6-5.6 5.6S2.9 16.2 2.9 13.1s2.5-5.6 5.6-5.6c.3 0 .6 0 .9.1v2.5c-.3-.1-.6-.2-.9-.2-1.8 0-3.2 1.4-3.2 3.2s1.4 3.2 3.2 3.2 3.2-1.4 3.2-3.2V2z"
                  />

                </svg>

              </a>

            </div>

          </div>

        </div>


        <!-- ===============================================
             COMENTÁRIOS
        ================================================ -->

        <section
          class="comentarios-section"
          aria-labelledby="comentariosTitulo"
        >

          <div class="comentarios-header">

            <span class="comentarios-icon">

              <i data-lucide="message-circle"></i>

            </span>

            <div>

              <span class="comentarios-label">
                Comunidade
              </span>

              <h2 id="comentariosTitulo">
                Comentários
              </h2>

            </div>

          </div>


          <form id="formComentario">

            <div class="comentario-field">

              <label for="nomeComentario">
                Seu nome
              </label>

              <input
                type="text"
                id="nomeComentario"
                name="nome"
                placeholder="Como podemos chamar você?"
                autocomplete="name"
                maxlength="80"
                required
              >

            </div>


            <div class="comentario-field">

              <label for="textoComentario">
                Comentário
              </label>

              <textarea
                id="textoComentario"
                name="comentario"
                placeholder="Compartilhe sua opinião sobre este conteúdo..."
                maxlength="1000"
                required
              ></textarea>

            </div>


            <button
              type="submit"
              class="comentario-submit"
            >

              <i data-lucide="send"></i>

              <span>
                Enviar comentário
              </span>

            </button>

          </form>


          <div
            id="listaComentarios"
            class="lista-comentarios"
            aria-live="polite"
          >
          </div>

        </section>

      </aside>


      <!-- =================================================
           ARTIGOS RELACIONADOS
      ================================================== -->

      <section
        class="relacionados-section"
        aria-labelledby="relacionadosTitulo"
      >

        <div class="relacionados-header">

          <span class="tag">
            Continue lendo
          </span>

          <h2 id="relacionadosTitulo">
            Você também pode gostar
          </h2>

          <p>
            Outros conteúdos do PsiFácil para continuar sua leitura.
          </p>

        </div>


        <div
          class="relacionados-grid"
          id="postsRelacionados"
        >
        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       RODAPÉ SIMPLES
  ====================================================== -->

  <footer class="post-footer">

    <div class="post-footer-container">

      <a
        href="psifacil.html"
        class="post-footer-brand"
      >
        PsiFácil
      </a>

      <p>
        Conteúdo para informar, refletir e cuidar melhor de si.
      </p>

    </div>

  </footer>


  <!-- LUCIDE -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    lucide.createIcons();
  </script>


  <!-- JS -->
  <script src="js/post.js"></script>

</body>

</html>
